[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfix-agent"
version = "0.1.0"
description = "An agent that finds and fixes the bug behind failing tests, in any language. Built twice: raw API and Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pytest>=8",
    "PyYAML>=6",
    "claude-agent-sdk>=0.1",
    "streamlit>=1.40",
]

[project.scripts]
bugfix = "cli.main:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["core*", "raw_agent*", "sdk_agent*", "benchmark*", "cli*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmark/cases", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "PTH"]
# RUF003 flags Hebrew letters in comments as "confusable" with Latin ones.
ignore = ["ANN401", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["benchmark/cases/"]
